<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expedientes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Expedientes Vento</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f7f3ec">
<script>
/* Modo claro/oscuro antes de pintar (diseño-vento.md). Clave compartida entre
   todas las apps Vento: "vento-tema" (se lee también la anterior, "temaVento"). */
(function(){
  var t=null;
  try{t=localStorage.getItem("vento-tema")||localStorage.getItem("temaVento");}catch(e){}
  if(t!=="dark"&&t!=="light")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";
  document.documentElement.dataset.theme=t;
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Oswald:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css?v=8">
</head>
<body>
<div class="vh" role="banner">
  <div class="vh-in">
    <a class="vh-marca" href="./" aria-label="Inicio de esta herramienta">Vento Chalco<span>· Expedientes</span></a>
    <div class="vh-acc">
      <a class="vh-portal" href="https://jesus-trapala.github.io/cotizador-vento-chalco/#inicio">← App</a>
      <button type="button" class="vh-tema" id="btn-tema" title="Cambiar modo claro / oscuro" aria-label="Cambiar modo claro / oscuro">
        <svg class="ico-luna" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="ico-sol" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </div>
</div>
  <header class="barra">
    <button class="barra-atras" id="btn-atras" aria-label="Atrás" hidden>‹</button>
    <h1 id="titulo">Expedientes Vento</h1>
  </header>
  <main id="app"></main>

  <script src="js/config.js?v=8"></script>
  <script src="js/db.js?v=8"></script>
  <script src="js/camera.js?v=8"></script>
  <script src="js/pdf.js?v=8"></script>
  <script src="js/share.js?v=8"></script>
  <script src="js/app.js?v=8"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Si llega una versión nueva de la app, recarga una vez para usarla.
      const habiaVersion = !!navigator.serviceWorker.controller;
      let recargado = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (habiaVersion && !recargado) { recargado = true; location.reload(); }
      });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(r => r.update()).catch(() => {}));
    }
  </script>
<script>
/* Botón luna/sol: guarda el modo en "vento-tema" (compartido entre las apps Vento). Solo diseño. */
(function(){
  var raiz=document.documentElement, meta=document.querySelector('meta[name="theme-color"]');
  function pintar(){ if(meta) meta.content = raiz.dataset.theme==="dark" ? "#0d0f14" : "#f7f3ec"; }
  pintar();
  var b=document.getElementById("btn-tema");
  if(b) b.addEventListener("click",function(){
    var nuevo = raiz.dataset.theme==="dark" ? "light" : "dark";
    raiz.dataset.theme = nuevo;
    try{ localStorage.setItem("vento-tema",nuevo); localStorage.setItem("temaVento",nuevo); }catch(e){}
    pintar();
    window.dispatchEvent(new CustomEvent("vento-tema",{detail:nuevo}));
  });
})();
</script>
<script>
/* Abierta desde la app Vento Chalco (?desde=app): el botón de regreso dice
   "← App" y lleva a la app en lugar del Portal (diseño-vento.md §9).      */
(function(){
  var desde=false;
  try{ desde=/[?&]desde=app(&|$)/.test(location.search);
       if(desde) sessionStorage.setItem("vento-desde-app","1"); else desde=sessionStorage.getItem("vento-desde-app")==="1"; }catch(e){}
  if(!desde) return;
  var b=document.querySelector(".vh-portal"); if(!b) return;
  b.href="https://jesus-trapala.github.io/cotizador-vento-chalco/#inicio"; b.textContent="← App";
})();
</script>
</body>
</html>
