<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b3121f">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Expedientes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Expedientes Vento</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css?v=5">
</head>
<body>
  <header class="barra">
    <button class="barra-atras" id="btn-atras" aria-label="Atrás" hidden>‹</button>
    <h1 id="titulo">Expedientes Vento</h1>
  </header>
  <main id="app"></main>

  <script src="js/config.js?v=5"></script>
  <script src="js/db.js?v=5"></script>
  <script src="js/camera.js?v=5"></script>
  <script src="js/pdf.js?v=5"></script>
  <script src="js/share.js?v=5"></script>
  <script src="js/app.js?v=5"></script>
  <script>
    if ('serviceWorker' in navigator) {
      // Si llega una versión nueva de la app, recarga una vez para usarla.
      const habiaVersion = !!navigator.serviceWorker.controller;
      let recargado = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (habiaVersion && !recargado) { recargado = true; location.reload(); }
      });
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' })
        .then(r => r.update()).catch(() => {}));
    }
  </script>
</body>
</html>
